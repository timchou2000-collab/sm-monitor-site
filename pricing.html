<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中壢調價建議 · SM 控房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe7;--panel:#fffdf9;--ink:#23211c;--muted:#8a8478;--line:#e4ddcf;
--brand:#1d3b34;--gold:#a9824b;--up:#1d7a3e;--down:#c0392b;--radius:14px;
--shadow:0 1px 2px rgba(40,35,25,.05),0 8px 24px rgba(40,35,25,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.55;
-webkit-font-smoothing:antialiased;
background-image:radial-gradient(circle at 12% -8%,rgba(169,130,75,.10),transparent 40%),radial-gradient(circle at 92% 0,rgba(29,59,52,.08),transparent 38%)}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px 80px}
header.top{padding:30px 0 20px;border-bottom:1px solid var(--line);margin-bottom:18px;position:relative}
header.top::before{content:"";position:absolute;top:0;left:-100vw;right:-100vw;height:4px;
background:linear-gradient(90deg,var(--brand),var(--gold))}
.home{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;margin-bottom:16px}
.home:hover{color:var(--brand)}
.kicker{font:600 12px/1 "Noto Sans TC";letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
h1.title{font-family:"Fraunces","Noto Serif TC",serif;font-weight:600;font-size:clamp(25px,5vw,38px);color:var(--brand);line-height:1.05}
h1.title .zh{font-family:"Noto Serif TC",serif;font-weight:700}
.meta{margin-top:12px;color:var(--muted);font-size:13px}
.meta b{color:var(--ink);font-weight:700}
.banner{background:#fbeedd;border:1px solid #e6c79a;color:#8a5a1f;border-radius:var(--radius);padding:11px 16px;font-size:13px;font-weight:600;margin:16px 0 18px}
.runbar{margin:14px 0 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
button.run{appearance:none;border:none;cursor:pointer;background:var(--brand);color:#fffdf9;
font-family:"Noto Sans TC";font-weight:700;font-size:15px;padding:12px 24px;border-radius:99px;box-shadow:var(--shadow);transition:transform .08s,opacity .2s}
button.run:hover{transform:translateY(-1px)} button.run:disabled{opacity:.55;cursor:wait}
button.push{background:#cdbfa6;color:#5a513f;cursor:not-allowed}
button.run.apply{background:var(--gold);color:#fffdf9;cursor:pointer}
button.run.apply:disabled{opacity:.5;cursor:not-allowed}
.tbl td.pk,.tbl th.pk{text-align:center;width:30px}
.tbl input[type=checkbox]{width:15px;height:15px;accent-color:var(--gold);cursor:pointer}
.applybox{background:#f0ede6;border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:14px 0;font-size:13px;display:none}
.applybox.show{display:block}
.applybox h3{font-size:13px;color:var(--brand);margin-bottom:6px}
.applybox .rowline{padding:2px 0;color:var(--ink)}
.applybox .ng{color:var(--down)}
.status{font-size:13px;color:var(--muted)} .status.err{color:var(--down);font-weight:600}
.notice{background:#fdecea;border:1px solid #f3c0ba;color:#a33027;border-radius:var(--radius);padding:12px 16px;font-size:13px;margin-bottom:18px;display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:11px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat .n{font-family:"Fraunces",serif;font-size:26px;font-weight:600;line-height:1;color:var(--brand)}
.stat .l{margin-top:6px;font-size:12px;color:var(--muted)}
.stat.up .n{color:var(--up)} .stat.down .n{color:var(--down)}
.tblwrap{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:680px}
.tbl th,.tbl td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child,.tbl th:last-child,.tbl td:last-child{text-align:left}
.tbl th{color:var(--muted);font-weight:600;font-size:11px;position:sticky;top:0;background:var(--panel)}
.tbl tr:last-child td{border-bottom:none}
.tbl td.cur{color:var(--muted)} .tbl td.pro{font-weight:700}
.tbl tr.r td.pro{color:var(--up)} .tbl tr.d td.pro{color:var(--down)}
.tbl td.dl.up{color:var(--up);font-weight:700} .tbl td.dl.dn{color:var(--down);font-weight:700}
.tbl .sat td:first-child{color:var(--gold);font-weight:700}
.tbl td.rsn{color:var(--muted);font-size:11.5px;white-space:normal;min-width:200px}
.empty{color:var(--muted);font-size:13px;padding:16px}
footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <a class="home" href="./">← 回首頁</a>
  <div class="kicker">Dynamic Pricing · Advisory</div>
  <h1 class="title"><span class="zh">中壢</span> · 調價建議 <span style="font-size:.5em;color:var(--muted)">主力大房</span></h1>
  <div class="meta" id="meta">載入上次建議…</div>
</header>
<div class="banner">⚠️ 勾選要套用的日期後按「套用勾選的調價」，<b>才會真的寫入 SiteMinder</b>。系統以伺服器端最新建議為準、只寫你勾選且建議有變動的日期，並受地板/天花板/單筆上限硬擋。未勾選不會動。</div>
<div class="notice" id="notice"></div>
<div class="runbar">
  <button class="run" id="btn" onclick="runNow()">重新計算建議</button>
  <button class="run apply" id="pushbtn" onclick="applySelected()" disabled>套用勾選的調價 →</button>
  <span class="status" id="status"></span>
</div>
<div class="applybox" id="applybox"></div>
<div class="stats" id="grand"></div>
<div class="tblwrap"><table class="tbl" id="tbl"><tbody><tr><td class="empty">尚未載入</td></tr></tbody></table></div>
<footer id="foot">模型：實際入住進度 vs 理想進度（積極）＋ 進單速度疊加，夾在地板/天花板內。資料為當日 09:00 快照。</footer>
</div>
<script>
var BASE='https://desktop-b6agd8d.tailf02da5.ts.net';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function num(n){return (n==null)?'—':Number(n).toLocaleString('en-US');}
function render(d){
  if(!d||!d.rows){return;}
  document.getElementById('meta').innerHTML=
    '<b>'+esc(d.hotel||'')+'</b> · '+esc(d.room||'')+'　快照 <b>'+(d.snapshotDate||'—')+'</b>　計算於 <b>'+(d.generated||'—')+'</b>';
  document.getElementById('foot').innerHTML=
    '模型：實際入住進度 vs 理想進度（積極）＋ 進單速度疊加。地板 週六 '+num(d.floorSat)+' / 平日 '+num(d.floorOther)+
    '｜天花板 '+num(d.ceiling)+'｜每級 '+num(d.level)+'、單次最多 ±'+d.maxLevels+' 級'+
    (d.cooldownDays?'｜穩定：'+d.cooldownDays+'天冷卻、'+d.reversalDays+'天不反向（強訊號破例）':'')+
    '｜資料為當日 09:00 快照｜occ 以歷史最大可售量為容量基準';
  var s=d.summary||{};
  var g=document.getElementById('grand');g.innerHTML='';
  g.appendChild(el('div','stat up','<div class="n">↑ '+(s.raise||0)+'</div><div class="l">建議調高</div>'));
  g.appendChild(el('div','stat down','<div class="n">↓ '+(s.lower||0)+'</div><div class="l">建議調低</div>'));
  g.appendChild(el('div','stat','<div class="n">＝ '+(s.hold||0)+'</div><div class="l">維持</div>'));
  g.appendChild(el('div','stat','<div class="n">'+(s.total||0)+'</div><div class="l">涵蓋天數</div>'));
  var rows=d.rows.map(function(r){
    var cls=(r.action==='raise'?'r':(r.action==='lower'?'d':''))+(r.weekday==='六'?' sat':'');
    var arrow=r.action==='raise'?'▲':(r.action==='lower'?'▼':'＝');
    var dlcls=r.delta>0?'dl up':(r.delta<0?'dl dn':'dl');
    var dltxt=r.delta>0?('+'+r.delta):(r.delta<0?(''+r.delta):'0');
    var changed=(r.action!=='hold'&&r.delta!==0);
    var pick=changed?('<input type="checkbox" class="pick" value="'+r.date+'" onchange="updateApplyBtn()">'):'';
    return '<tr class="'+cls+'">'+
      '<td class="pk">'+pick+'</td>'+
      '<td>'+r.date.slice(5)+' '+r.weekday+'</td>'+
      '<td>'+r.lead+'</td>'+
      '<td>'+r.avail+'</td>'+
      '<td>'+Math.round((r.occ||0)*100)+'%</td>'+
      '<td>'+(r.pickup7==null?'—':r.pickup7)+'</td>'+
      '<td class="cur">'+num(r.current)+'</td>'+
      '<td class="pro">'+arrow+' '+num(r.proposed)+'</td>'+
      '<td class="'+dlcls+'">'+dltxt+'</td>'+
      '<td class="rsn">'+esc(r.reason||'')+'</td></tr>';
  }).join('');
  document.getElementById('tbl').innerHTML=
    '<thead><tr><th class="pk"><input type="checkbox" id="selall" onchange="toggleAll(this)" title="全選有變動的"></th><th>日期</th><th>lead</th><th>存量</th><th>occ</th><th>近7售</th><th>現價</th><th>建議</th><th>Δ</th><th>原因</th></tr></thead><tbody>'+rows+'</tbody>';
  updateApplyBtn();
}
function pickedDates(){
  return Array.prototype.slice.call(document.querySelectorAll('.pick:checked')).map(function(c){return c.value;});
}
function updateApplyBtn(){
  var n=pickedDates().length;
  var b=document.getElementById('pushbtn');
  b.disabled=(n===0); b.textContent=n?('套用 '+n+' 天的調價 →'):'套用勾選的調價 →';
}
function toggleAll(box){
  Array.prototype.slice.call(document.querySelectorAll('.pick')).forEach(function(c){c.checked=box.checked;});
  updateApplyBtn();
}
function applySelected(){
  var dates=pickedDates();
  if(!dates.length) return;
  if(!confirm('確定把這 '+dates.length+' 天套用建議價、寫入 SiteMinder 線上房價嗎？\n（只會寫建議有變動的日期，且受地板/天花板/上限保護）'))
    return;
  var b=document.getElementById('pushbtn'); b.disabled=true; b.textContent='寫入中…';
  setStatus('正在寫入 SiteMinder…');
  fetch(BASE+'/apply-pricing',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({dates:dates})}).then(function(r){return r.json();}).then(function(res){
    showApply(res);
    if(res.payload){render(res.payload);}
    setStatus(res.ok?'寫入完成':'寫入未全部成功（見上方明細）',!res.ok);
    runNow();   // 重新計算，刷新建議與冷卻狀態
  }).catch(function(){
    setStatus('連線不到家裡那台，寫入未執行',true);
    showNotice('連不到端點，沒有送出任何寫入。請確認 Tailscale 與家裡那台。');
  }).finally(function(){updateApplyBtn();});
}
function showApply(res){
  var box=document.getElementById('applybox'); box.className='applybox show';
  var h='<h3>'+(res.ok?'✅ 套用完成':'⚠️ 套用結果（部分未成功）')+'</h3>';
  (res.plan||[]).forEach(function(p){
    h+='<div class="rowline">'+p.date.slice(5)+'：'+num(p.old)+' → <b>'+num(p.new)+'</b> ✓</div>';
  });
  (res.rejected||[]).forEach(function(p){
    h+='<div class="rowline ng">'+p.date.slice(5)+'：擋下（'+esc(p.reason||'')+'）</div>';
  });
  (res.skipped||[]).forEach(function(p){
    h+='<div class="rowline ng">'+p.date.slice(5)+'：略過（'+esc(p.reason||'')+'）</div>';
  });
  if(res.error)h+='<div class="rowline ng">'+esc(res.error)+'</div>';
  if(res.dispatched!=null)h+='<div class="rowline" style="color:var(--muted);margin-top:6px">派發 '+(res.dispatched?'成功':'失敗')+'｜狀態確認 '+(res.statusConfirmed===true?'OK':(res.statusConfirmed===false?'失敗':'逾時(以實際為準)'))+'</div>';
  box.innerHTML=h;
}
function setStatus(t,err){var s=document.getElementById('status');s.textContent=t||'';s.className='status'+(err?' err':'');}
function showNotice(m){var n=document.getElementById('notice');n.innerHTML=m;n.style.display='block';}
function runNow(){
  var b=document.getElementById('btn');b.disabled=true;b.textContent='計算中…';setStatus('讀取最新快照、重新計算建議…');
  document.getElementById('notice').style.display='none';
  fetch(BASE+'/run-pricing').then(function(r){return r.json();}).then(function(res){
    if(res.ok&&res.payload){render(res.payload);setStatus('已更新 '+(res.payload.generated||''));}
    else{setStatus('計算失敗（exit '+res.returncode+'）：'+((res.error||'').slice(-200)),true);
      if(res.payload)render(res.payload);}
  }).catch(function(e){
    setStatus('連線不到家裡那台',true);
    showNotice('連不到端點。請確認這台裝置在你的 Tailscale 內、且家裡那台開著。');
  }).finally(function(){b.disabled=false;b.textContent='重新計算建議';});
}
if(new URLSearchParams(location.search).get('run')==='1'){
  runNow();
}else{
  fetch(BASE+'/pricing.json').then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(d&&d.rows){render(d);setStatus('（上次建議，按按鈕重新計算）');}
  }).catch(function(){
    setStatus('（尚未載入；按按鈕計算）');
    showNotice('連不到端點。請確認這台裝置在你的 Tailscale 內、且家裡那台開著。');
  });
}
</script>
</body>
</html>
