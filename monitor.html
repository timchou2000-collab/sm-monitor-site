<style>
:root{
  --bg:#f3efe7; --panel:#fffdf9; --ink:#23211c; --muted:#8a8478;
  --line:#e4ddcf; --brand:#1d3b34; --gold:#a9824b;
  --low:#c0392b; --low-bg:#fbe9e6; --high:#2f6fa0; --high-bg:#e7f0f7;
  --hot:#c2761f; --hot-bg:#fbeedd; --stay:#3f7a5c; --stay-bg:#e8f2eb;
  --radius:14px; --shadow:0 1px 2px rgba(40,35,25,.05),0 8px 24px rgba(40,35,25,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC",sans-serif;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 12% -8%,rgba(169,130,75,.10),transparent 40%),radial-gradient(circle at 92% 0,rgba(29,59,52,.08),transparent 38%);}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px 80px}
</style>
</head>
<body>
<style>
header.top{padding:38px 0 22px;border-bottom:1px solid var(--line);margin-bottom:26px;position:relative}
header.top::before{content:"";position:absolute;top:0;left:-100vw;right:-100vw;height:4px;
  background:linear-gradient(90deg,var(--brand),var(--gold))}
.home{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;margin-bottom:16px}
.home:hover{color:var(--brand)}
.kicker{font:600 12px/1 "Noto Sans TC";letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
h1.title{font-family:"Fraunces","Noto Serif TC",serif;font-weight:600;font-size:clamp(30px,5vw,46px);
  letter-spacing:-.01em;color:var(--brand);line-height:1.05}
h1.title .zh{font-family:"Noto Serif TC",serif;font-weight:700}
.meta{margin-top:14px;display:flex;gap:22px;flex-wrap:wrap;color:var(--muted);font-size:13.5px}
.meta b{color:var(--ink);font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 30px}
.tab{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  font:600 14.5px "Noto Sans TC";padding:10px 20px;border-radius:999px;cursor:pointer;transition:.18s}
.tab:hover{border-color:var(--gold)}
.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:8px;vertical-align:middle}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:30px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat .n{font-family:"Fraunces",serif;font-size:30px;font-weight:600;line-height:1}
.stat .l{margin-top:7px;font-size:12.5px;color:var(--muted);font-weight:500}
.stat.low .n{color:var(--low)} .stat.high .n{color:var(--high)}
.stat.hot .n{color:var(--hot)} .stat.stay .n{color:var(--stay)} .stat.fast .n{color:var(--hot)}
</style>
<style>
section.blk{margin:0 0 34px}
.blk-head{display:flex;align-items:baseline;gap:11px;margin-bottom:15px}
.blk-head .ic{font-size:18px}
.blk-head h2{font-family:"Noto Serif TC",serif;font-size:19px;font-weight:700}
.blk-head .sub{color:var(--muted);font-size:12.5px;font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow)}
.card .room{font-weight:700;font-size:14.5px;margin-bottom:11px;display:flex;align-items:center;gap:8px}
.card .room .tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.tag.low{background:var(--low-bg);color:var(--low)} .tag.high{background:var(--high-bg);color:var(--high)}
.tag.hot{background:var(--hot-bg);color:var(--hot)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:5px 9px;border-radius:8px;border:1px solid transparent;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip .d{opacity:.62;font-weight:500;margin-right:5px}
.chip.low{background:var(--low-bg);color:var(--low);border-color:#f2cdc6}
.chip.high{background:var(--high-bg);color:var(--high);border-color:#cfe0ee}
.chip.hot{background:var(--hot-bg);color:var(--hot);border-color:#eed4b3}
.fastcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--hot);
  border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.fastcard .fh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:13px;gap:12px;flex-wrap:wrap}
.fastcard .fd{font-weight:700;font-size:15px}
.fastcard .big{font-family:"Fraunces",serif;font-size:26px;font-weight:600;color:var(--hot)}
.fastcard .thr{color:var(--muted);font-size:12.5px}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:84px 1fr 30px;align-items:center;gap:10px;font-size:12px}
.bar .bn{color:var(--muted)}
.bar .track{height:8px;background:#efe7d7;border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--hot));border-radius:99px}
.bar .bv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
</style>
<style>
.dip{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--stay);
  border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.dip .dr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px}
.dip .range{font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
.dip .days{color:var(--muted);font-size:12px;font-weight:500}
.dip .delta{background:var(--stay-bg);color:var(--stay);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.dip .pts{display:flex;gap:18px;font-size:12.5px;color:var(--muted);margin-bottom:9px;flex-wrap:wrap}
.dip .pts b{color:var(--ink)}
.dip .rec{font-size:12.5px;color:var(--stay);font-weight:600}
.empty{color:var(--muted);font-size:13.5px;padding:8px 2px}
footer{margin-top:46px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.7}
.hotel{display:none} .hotel.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:640px){.wrap{padding:0 16px 60px}.bar{grid-template-columns:70px 1fr 26px}}
.ptable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);max-height:560px}
.ptable{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.ptable th,.ptable td{padding:9px 15px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.ptable th{position:sticky;top:0;background:var(--brand);color:#fff;font-weight:600;font-size:12.5px;z-index:1}
.ptable th.own{background:var(--gold)}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.ptable td.dcell{font-weight:700;color:var(--muted)}
.ptable td.own{background:rgba(169,130,75,.08)}
.ptable td.low{color:var(--stay);font-weight:700}
.ptable td.low::after{content:"▼";font-size:9px;margin-left:4px;opacity:.65}
.ptable td.na{color:var(--muted)}
.ptable tbody tr:hover{background:rgba(29,59,52,.035)}
.plegend{margin-top:10px;font-size:12px;color:var(--muted);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.plegend .k{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.plegend .k.low{background:var(--stay)} .plegend .k.own{background:var(--gold)}
</style>

}

function dipCards(groups){
  return groups.map(g=>
    `<div class="card"><div class="room">${esc(g.room)}<span class="tag" style="background:var(--stay-bg);color:var(--stay)">min.stay=2</span></div>
     <div style="display:grid;gap:10px">`+g.dips.map(d=>
       `<div class="dip"><div class="dr"><span class="range">${md(d.start)} – ${md(d.end)}</span><span class="delta">Δ ${d.delta}</span></div>
        <div class="days">凹陷區間 ${d.days} 天</div>
        <div class="pts"><span>最低 <b>${md(d.lowDate)}</b> 剩 <b>${d.lowQty}</b> 間</span><span>最高 <b>${md(d.highDate)}</b> 剩 <b>${d.highQty}</b> 間</span></div>
        <div class="rec">→ 建議 SiteMinder 設 min.stay=2</div></div>`).join('')+
     `</div></div>`).join('');
}

function section(ic,title,sub,inner){
  if(!inner) return '';
  return `<section class="blk"><div class="blk-head"><span class="ic">${ic}</span><h2>${title}</h2><span class="sub">${sub}</span></div>${inner}</section>`;
}

function priceSection(p){
  const cols=p.targets, own0=cols[0];
  const head=`<tr><th>月/日</th>`+cols.map(c=>`<th${c===own0?' class="own"':''}>${esc(c)}</th>`).join('')+`</tr>`;
  const body=p.rows.map(r=>{
    const vals=cols.map(c=>r.prices?r.prices[c]:null);
    const nums=vals.filter(v=>typeof v==='number');
    const min=nums.length?Math.min(...nums):null;
    const tds=cols.map((c,i)=>{
      const v=vals[i], own=(c===own0);
      if(typeof v!=='number') return `<td class="na${own?' own':''}">—</td>`;
      const cls=[]; if(v===min)cls.push('low'); if(own)cls.push('own');
      return `<td class="${cls.join(' ')}">${v.toLocaleString()}</td>`;
    }).join('');
    return `<tr><td class="dcell">${md(r.date)}</td>${tds}</tr>`;
  }).join('');
  const sub=`無痕抓取 · 2 大人 1 房 1 晚最低價 · TWD · 更新 ${esc(p.generated||'')}`;
  return `<section class="blk"><div class="blk-head"><span class="ic">💰</span><h2>Booking 同業比價</h2><span class="sub">${sub}</span></div>`+
    `<div class="ptable-wrap"><table class="ptable"><thead>${head}</thead><tbody>${body}</tbody></table></div>`+
    `<div class="plegend"><span><span class="k low"></span>當日最低價</span><span><span class="k own"></span>${esc(own0)}（自家）</span></div></section>`;
}
</script>
<script>
function renderHotel(h){
  let s = statRow(h);
  if(h.price) s += priceSection(h.price);
  s += section('⚠️','全館進單過快','SiteMinder 進單速度超出門檻', h.fast.length?fastCards(h.fast):'');
  s += section('🔥','進單熱點','過去 3 天累計進單偏熱的日期', h.hot.length?chipCards(h.hot,'hot'):'');
  s += section('🔔','庫存偏低','可考慮收一價或關控的日期', h.low.length?chipCards(h.low,'low'):'');
  s += section('🔔','庫存偏高','去化偏慢、可考慮促銷的日期', h.high.length?chipCards(h.high,'high'):'');
  s += section('📊','min.stay = 2 建議','連續低庫存凹陷區，可設最短住宿', h.minstay.length?`<div class="cards">${dipCards(h.minstay)}</div>`:'');
  if(s===statRow(h)) s+='<div class="empty">本日無觸發訊號。</div>';
  return s;
}

function init(){
  document.getElementById('meta').innerHTML =
    `<span>報告日期 <b>${DATA.reportDate||'—'}</b></span><span>產生時間 <b>${DATA.generated}</b></span><span>監測館數 <b>${DATA.hotels.length}</b></span>`;
  const tabs=document.getElementById('tabs'), content=document.getElementById('content');
  DATA.hotels.forEach((h,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===0?' active':''); b.innerHTML=esc(h.name);
    b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.hotel').forEach(t=>t.classList.remove('active'));
      b.classList.add('active'); document.getElementById('h'+i).classList.add('active');};
    tabs.appendChild(b);
    const d=document.createElement('div'); d.className='hotel'+(i===0?' active':''); d.id='h'+i;
    d.innerHTML=renderHotel(h); content.appendChild(d);
  });
  document.getElementById('foot').innerHTML =
    `資料來源：SM_control monitor（SiteMinder 庫存 / 進單）· 內部營運參考，非機密資料。<br>本頁每日自動更新；訊號為演算法初步建議，實際調價以現場判斷為準。`;
}
init();
</script>
</body>
</html>
